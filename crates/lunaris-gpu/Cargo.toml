[package]
name = "lunaris-gpu"
description = "The Lunaris GPU renderer on wgpu (Vulkan, DirectX 12, Metal): a classic mode that matches the reference CPU renderer, and a high-quality mode with physically based shading, cascaded shadows, ambient occlusion, bloom, filmic tone mapping and MSAA."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lunaris-ecs = { path = "../lunaris-ecs" }
lunaris-sim = { path = "../lunaris-sim" }
lunaris-render = { path = "../lunaris-render" }
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan", "wgsl", "std"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl", "std"] }

[dev-dependencies]
lunaris-json = { path = "../lunaris-json" }
png = "0.18"

[lints]
workspace = true
