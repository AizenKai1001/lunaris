name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

# a newer push replaces the run of an older one (a slow software-graphics run need not finish for a commit that is already out of date)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the editor crate is a Windows application and is checked in its own job, the graphics tests have theirs
      # through ci_step.sh so that a failure is written as an annotation (the log of a run cannot be read without signing in)
      - run: bash tools/ci_step.sh --workspace --exclude lunaris-studio --exclude lunaris-gpu --no-fail-fast

  graphics:
    name: graphics (windows, software adapter)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The runner has no graphics card: wgpu draws with Windows' software adapter (WARP). The classic-quality tests (the GPU renderer against the reference renderer, pixel by pixel) run here, each as its
      # own step with a time limit, and write what failed as an annotation (ci_step.sh). The HIGH-quality tests are not run here: on this runner one high-quality picture takes minutes (the same tests take
      # 1 to 2 minutes on a four-core Windows 11 machine and seconds on a card; four scenes of the look test ran past 20 minutes), so they run on machines with a card: `cargo test -p lunaris-gpu
      # --test compare --test high`. On Linux the runner has no adapter at all and the graphics tests skip themselves.
      - name: graphics, unit tests
        if: always()
        run: bash tools/ci_step.sh -p lunaris-gpu --lib
        timeout-minutes: 15
        env:
          STEP_TIMEOUT: 600
      - name: graphics, classic pictures match the reference renderer
        if: always()
        run: bash tools/ci_step.sh -p lunaris-gpu --test compare -- --exact classic_pictures_match_the_reference_renderer --nocapture
        timeout-minutes: 20
        env:
          STEP_TIMEOUT: 300
      - name: graphics, draw layers put sprites tile maps and particles in the same 
        if: always()
        run: bash tools/ci_step.sh -p lunaris-gpu --test compare -- --exact draw_layers_put_sprites_tile_maps_and_particles_in_the_same_order_in_both_renderers --nocapture
        timeout-minutes: 20
        env:
          STEP_TIMEOUT: 300
      - name: graphics, the interface keeps its shape on other screens in both rende
        if: always()
        run: bash tools/ci_step.sh -p lunaris-gpu --test compare -- --exact the_interface_keeps_its_shape_on_other_screens_in_both_renderers --nocapture
        timeout-minutes: 20
        env:
          STEP_TIMEOUT: 300
      - name: graphics, scroll views cut the interface at the viewport the same way 
        if: always()
        run: bash tools/ci_step.sh -p lunaris-gpu --test compare -- --exact scroll_views_cut_the_interface_at_the_viewport_the_same_way_in_both_renderers --nocapture
        timeout-minutes: 20
        env:
          STEP_TIMEOUT: 300
      - name: graphics, radial fills are the same shape in both renderers
        if: always()
        run: bash tools/ci_step.sh -p lunaris-gpu --test compare -- --exact radial_fills_are_the_same_shape_in_both_renderers --nocapture
        timeout-minutes: 20
        env:
          STEP_TIMEOUT: 300
      - name: graphics, the ui kit3 widgets are drawn the same in both renderers in 
        if: always()
        run: bash tools/ci_step.sh -p lunaris-gpu --test compare -- --exact the_ui_kit3_widgets_are_drawn_the_same_in_both_renderers_in_every_state --nocapture
        timeout-minutes: 20
        env:
          STEP_TIMEOUT: 300

  golden:
    name: the same hashes on every machine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p lunaris
      # every example scene's state hash and reference-picture hash must be the recorded one: a platform that differs is a bug
      - run: python tools/xplat_hashes.py target/debug/lunaris --check
        if: runner.os == 'Linux'
      - run: python tools/xplat_hashes.py target/debug/lunaris.exe --check
        if: runner.os == 'Windows'

  studio:
    name: editor builds (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p lunaris-studio
