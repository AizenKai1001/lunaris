name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

# a newer push replaces the run of an older one (a slow software-graphics run need not finish for a commit that is already out of date)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the editor crate is a Windows application and is checked in its own job; the GPU tests skip themselves when the runner has no graphics adapter.
      # They are separate steps (with their own time limits) so that the run says which part is slow on a machine that draws with the CPU
      - run: cargo test --workspace --exclude lunaris-studio --exclude lunaris-gpu --no-fail-fast
      - name: graphics, unit tests
        if: always()
        run: cargo test -p lunaris-gpu --lib
        timeout-minutes: 15
      - name: graphics, the picture next to the reference renderer's
        if: always()
        run: cargo test -p lunaris-gpu --test compare
        timeout-minutes: 30
      - name: graphics, the high-quality effects
        if: always()
        run: cargo test -p lunaris-gpu --test high
        timeout-minutes: 45

  golden:
    name: the same hashes on every machine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p lunaris
      # every example scene's state hash and reference-picture hash must be the recorded one: a platform that differs is a bug
      - run: python tools/xplat_hashes.py target/debug/lunaris --check
        if: runner.os == 'Linux'
      - run: python tools/xplat_hashes.py target/debug/lunaris.exe --check
        if: runner.os == 'Windows'

  studio:
    name: editor builds (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p lunaris-studio
